<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" sizes="32x32" href="/icon/cropped-logonuevo-32x32.png">
    <link rel="icon" sizes="192x192" href="/icon/cropped-logonuevo-192x192.png">
    <style>

        @import "/css/_theme.css";
        body {
            margin: 0%;
        }

        header {
            border-color: var(--gray-800);
            border-bottom: 1px solid;
            background-color: var(--main-color);
            font-family: var(--condensed-font);
        }

        nav {
            display: flex;
        }

        header h1 {
            color: var(--white);
            margin: 30px 100px 30px 100px;
            font-size: 3em;
        }

        header sub {
            font-size: 0.5em;
        }

        #searchBar {
            margin: 30px 0px 30px 280px;
            padding: 5px;
            border-bottom-left-radius: 20px;
            border-top-left-radius: 20px;
            width: 20vw;
            border: none;
        }

        #searchButton {
            margin: 30px 280px 30px 0px;
            padding: 10px;
            border-bottom-right-radius: 20px;
            border-top-right-radius: 20px;
            width: 5vw;
            border: none;
            background-color: var(--accent-color);
            color: var(--white);
        }

        button {
            background-color: var(--accent-color);
            border: none;
            border-radius: 100%;
            padding: 20px;
            margin: 30px 10px 30px 200px;
        }

        body, section {
            background-color: var(--grey-50);
            font-family: var(--primary-font);
        }

        section h1 {
            margin: 25px 0px 0px 80px;
        }

        #perfiles {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 30px;
            margin: 25px 80px 40px 80px;
        }

        .perfil img {
            width: 100%;
            height: 300px;
            border-radius: 30px 30px 0px 0px;
        }

        .perfil {
            background-color: var(--main-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0px 100px 0px 100px;
            padding-bottom: 40px;
            border-radius: 30px;
        }

        .perfil h2 {
            background-color: var(--white);
            width: 100%;
            margin: 0px;
            padding: 10px 0px;
            text-align: center;
        }

        footer {
            border-color: var(--gray-600);
            border-top-color: red;
            border-top: 1px solid;
        }

        footer p {
            color: var(--grey-400);
            text-align: center;
            margin: 20px 0px 20px 0px;
        }


    </style>
    <title>ATI[UCV]Log 2026-1</title>
</head>
<body>

    <header>
        <nav>
            <h1>ATI<sub>[UCV]</sub>Log</h1>
            <input id="searchBar" type="search" placeholder="Nombre...">
            <input id="searchButton" type="submit" value="Buscar">
            <button><img src="icon/userIcon.svg"></button>
        </nav>
    </header>
    <section>
        <h1>Semestre 2026-1</h1>
        <div id="perfiles">

            <div class="perfil">
                <img src="/30722334/30722334.jpeg" alt="Foto de perfil">
                <h2>Mauricio González</h2>
            </div>
            <div class="perfil">
                <img src="/Dummies/Dummy1.png" alt="Foto de perfil">
                <h2>Helena Torres</h2>
            </div>
            <div class="perfil">
                <img src="/Dummies/Dummy2.png" alt="Foto de perfil">
                <h2>Carlos Blanco</h2>
            </div>
            <div class="perfil">
                <img src="/Dummies/Dummy3.png" alt="Foto de perfil">
                <h2>Juan Gutiérrez</h2>
            </div>
            <div class="perfil">
                <img src="/Dummies/Dummy4.png" alt="Foto de perfil">
                <h2>Isabel Contreras</h2>
            </div>
            <div class="perfil">
                <img src="/Dummies/Dummy5.png" alt="Foto de perfil">
                <h2>Gabriel Vargas</h2>
            </div>

        </div>
    </section>
    <footer>
        <p>Copyright &copy; 2026 Escuela de computación - ATI. Todos los derechos reservados</p>
    </footer>
    
</body>
</html>
